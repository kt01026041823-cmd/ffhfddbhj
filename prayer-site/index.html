<style>

.daily{display:flex;gap:2px;align-items:flex-end;height:64px;overflow-x:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.band .top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}

form.stack{display:flex;flex-direction:column;gap:10px}
form.big input{font-size:20px!important;padding:14px 16px!important}
form.big .btn{font-size:20px;padding:14px}
form.big label{font-size:16px!important}
form.stack label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input[type=password]{font:inherit;font-size:17px;width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);letter-spacing:.1em}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  <div class="card">
    <div class="band">
      <div class="top"><small>추수감사절</small><button class="adminbtn" id="adminBtn" type="button">🔒 관리자</button></div>

<script>
// WordGrace와 같은 Firebase 실시간 데이터베이스를 쓰고, 기도표 기록은 prayer2026 아래에 따로 저장해요
const FB = 'https://symphonious-profiterole-3ca963-default-rtdb.firebaseio.com';
const FB_ROOT = 'prayer2026';
const POLL_MS = 5000;

// 기도표 코드가 쓰던 db.collection / db.doc 모양 그대로 Firebase REST로 연결해 주는 작은 도우미
function makeDb(){
  const url = p => FB + '/' + FB_ROOT + '/' + p + '.json';
  async function req(p, method, body){
    const r = await fetch(url(p), body===undefined ? {method} : {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok){ const e = new Error('firebase '+r.status); e.code = (r.status===401||r.status===403)?'permission-denied':'unavailable'; throw e; }
    return r.json();
  }
  const watchers = [];
  function watch(p, emit, onErr){
    let last; const w = {p, run: async () => {
      try{ const v = await req(p,'GET'); const s = JSON.stringify(v); if(s!==last){ last=s; emit(v); } }
      catch(e){ if(onErr) onErr(e); }
    }};
    watchers.push(w); w.run(); setInterval(w.run, POLL_MS);
  }
  const refresh = () => watchers.forEach(w => w.run());
  return {
    collection(p){ return { onSnapshot(cb, onErr){ watch(p, v => {
      const docs = Object.entries(v||{}).map(([id,d]) => ({id, data: () => d}));
      cb({docs, metadata:{hasPendingWrites:false}});
    }, onErr); } }; },
    doc(p){ return {
      set: d => req(p,'PUT',d).then(refresh),
      update: d => req(p,'PATCH',d).then(refresh),
      delete: () => req(p,'DELETE').then(refresh),
      onSnapshot(cb, onErr){ watch(p, v => cb({exists: v!=null, data: () => v}), onErr); }
    }; }
  };
}
</script>
<script>
(function(){
  const START = new Date(2026,9,12), END = new Date(2026,10,15);
  const pad = n => String(n).padStart(2,'0');
  const key = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const DAYS = [];
  for(let d=new Date(START); d<=END; d.setDate(d.getDate()+1)) DAYS.push(new Date(d));
  const TOTAL = DAYS.length;
  const todayKey = () => key(new Date());
  const isFuture = k => k > todayKey();
  const elapsed = () => DAYS.filter(d => key(d) <= todayKey()).length;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = ms => { if(!ms) return '-'; const d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate(); };
  const HEART = '<svg viewBox="0 0 32 30" aria-hidden="true"><path class="heart" d="M16 28C6 20 2 15 2 9.5 2 5.4 5.2 2.5 9 2.5c2.8 0 5 1.6 7 4.2 2-2.6 4.2-4.2 7-4.2 3.8 0 7 2.9 7 7 0 5.5-4 10.5-14 18.5z"/></svg>';
  const store = { get(k){try{return localStorage.getItem(k);}catch(e){return null;}}, set(k,v){try{localStorage.setItem(k,v);}catch(e){}}, del(k){try{localStorage.removeItem(k);}catch(e){}} };

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

  async function sha(txt){
    try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
    catch(e){ let h1=0x811c9dc5,h2=0x1234567; for(const c of txt){h1=Math.imul(h1^c.charCodeAt(0),16777619);h2=Math.imul(h2+c.charCodeAt(0),2654435761);} return 'f'+(h1>>>0).toString(16)+(h2>>>0).toString(16); }
  }
  const normName = n => n.trim().replace(/\s+/g,' ');
  const memberId = async name => 'm' + (await sha('member::'+normName(name))).slice(0,20);
  const pinHash = (id,pw) => sha('pin::'+id+'::'+pw);
  const adminPwHash = pw => sha('harvest-prayer-2026::'+pw);

  function gridHTML(set, interactive){
    let h = '<div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid">';
    for(let i=0;i<DAYS[0].getDay();i++) h += '<div class="cell empty"></div>';
    DAYS.forEach((d,i)=>{
      const k=key(d), on=set.has(k), sun=d.getDay()===0, fut=isFuture(k), today=k===todayKey(), last=i===TOTAL-1;
      const cls=['cell',on&&'on',sun&&'sun',fut&&'future',today&&'today',last&&'last'].filter(Boolean).join(' ');
      const label=(d.getMonth()+1)+'월 '+d.getDate()+'일'+(on?' 기도 완료':'');
      const inner=HEART+'<span class="num">'+d.getDate()+'</span>'+(last?'<span class="crown">♛</span>':'');
      h += interactive
        ? '<button class="'+cls+'" data-k="'+k+'" aria-pressed="'+on+'" aria-label="'+label+'"'+(fut?' aria-disabled="true"':'')+'>'+inner+'</button>'
        : '<div class="'+cls+'" title="'+label+'">'+inner+'</div>';
    });
    return h+'</div>';
  }
  function streak(set){
    let s=0; const t=todayKey();
    for(let i=DAYS.length-1;i>=0;i--){ const k=key(DAYS[i]); if(k>t) continue; if(set.has(k)) s++; else if(k===t) continue; else break; }
    return s;
  }

  // ---- 상태 ----
  let started=false, db=null, user=null, isOwner=false, loaded=false, readOnly=false;
  let members={};            // id -> {name, pin, days, createdAt, updatedAt}
  let meId=null, myDays=new Set(), inflight=0;
  let view='login', loginMode='login';
  let adminHash=null, adminLoaded=false, unlocked=false, changingPw=false;
  let openPerson=null, confirmDel=null, resetFor=null;

  function setView(v){ view=v; render(); }
  function render(){
    $('adminBtn').textContent = view==='admin' ? '← 기도표로' : '🔒 관리자';
    if(view==='admin') return renderAdmin();
    if(meId && members[meId]) return renderMe();
    return renderLogin();
  }
  $('adminBtn').onclick=()=>{ if(view==='admin'){ view = meId?'me':'login'; } else { view='admin'; } openPerson=null; confirmDel=null; resetFor=null; render(); };

  function notReady(m){
    if(!started || (db && !loaded)){ m.innerHTML='<p class="hint">기도표를 불러오는 중이에요…</p>'; return true; }
    if(!db){ m.innerHTML='<div class="notice" style="display:flex;flex-direction:column;gap:8px"><b>기도표를 불러오지 못했어요</b>'+
      '<span>인터넷 연결을 확인하고 다시 불러와 주세요. 계속 안 되면 관리자에게 알려 주세요.</span></div>'+
      '<button class="btn" id="retryBtn">다시 불러오기</button>'; $('retryBtn').onclick=()=>location.reload(); return true; }
    return false;
  }

  // ---- 로그인 / 처음 등록 ----
  function renderLogin(){
    const m=$('main'); if(notReady(m)) return;
    m.innerHTML =
      '<div class="sec-title" style="font-size:22px">이름과 비밀번호를 적어 주세요</div>'+
      '<form class="stack big" id="loginForm">'+
      '<label>이름<input type="text" id="lgName" maxlength="20" placeholder="예: 김초코" autocomplete="off"></label>'+
      '<label>비밀번호 (숫자 4자리)<input type="password" id="lgPw" maxlength="20" inputmode="numeric" placeholder="예: 1234" autocomplete="off"></label>'+
      '<button class="btn" type="submit">들어가기</button></form>'+
      '<p class="hint" style="font-size:15px">처음이시면 적으신 이름과 비밀번호로 바로 만들어져요. 다음부터 똑같이 적으시면 돼요. 은행 비밀번호 말고 새 번호를 써 주세요.</p>'+
      (readOnly?'<div class="notice">지금은 저장 권한이 없어요. 관리자에게 Firebase 저장 규칙을 확인해 달라고 하세요.</div>':'');
    $('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const name=normName($('lgName').value), pw=$('lgPw').value.trim();
      if(!name){toast('이름을 적어 주세요');return;}
      if(pw.length<4){toast('비밀번호를 4자리 적어 주세요');return;}
      const id=await memberId(name), h=await pinHash(id,pw), ex=members[id];
      if(ex){
        if(ex.pin!==h){toast('비밀번호가 달라요. 다시 적어 주세요');$('lgPw').value='';return;}
        if(ex.pw!==pw) db.doc('members/'+id).update({pw}).catch(()=>{});
        login(id); return;
      }
      try{
        await db.doc('members/'+id).set({name,pin:h,pw,days:[],createdAt:Date.now(),updatedAt:Date.now()});
        login(id); toast(name+'님, 환영해요!');
      }catch(err){ if(err&&err.code==='permission-denied'){readOnly=true;render();} toast('들어가지 못했어요. 잠시 후 다시 해 주세요'); }
    });
  }
  function login(id){ meId=id; myDays=new Set((members[id]&&members[id].days)||[]); store.set('prayer-me',id); view='me'; render(); }
  function logout(){ meId=null; myDays=new Set(); store.del('prayer-me'); view='login'; loginMode='login'; render(); }

  // ---- 내 기도표 ----
  function saveDays(){
    inflight++;
    db.doc('members/'+meId).update({days:[...myDays].sort(),updatedAt:Date.now()})
      .catch(e=>{ if(e&&e.code==='permission-denied'){readOnly=true;} toast('저장하지 못했어요. 다시 눌러 주세요'); })
      .finally(()=>{ inflight--; });
  }
  function renderMe(){
    const m=$('main'); if(notReady(m)) return;
    const me=members[meId], n=myDays.size, el=elapsed();
    m.innerHTML =
      '<div class="me"><div class="name">'+esc(me.name)+'<span>님의 기도표</span></div><button class="btn ghost" id="logoutBtn">로그아웃</button></div>'+
      '<div class="prog"><div class="row"><span><b>'+n+'</b> / '+TOTAL+'일 기도</span><span>연속 '+streak(myDays)+'일 · 지난 날 중 '+(el?Math.round(n/el*100):0)+'%</span></div>'+
      '<div class="bar"><i style="width:'+(n/TOTAL*100)+'%"></i></div></div>'+
      gridHTML(myDays,true)+
      '<p class="hint">하트를 눌러 기도한 날을 체크해요. 다시 누르면 취소돼요. 앞으로 올 날은 그날이 되면 체크할 수 있어요.</p>'+
      (readOnly?'<div class="notice">지금은 저장 권한이 없어요. 관리자에게 Firebase 저장 규칙을 확인해 달라고 하세요.</div>':'');
    $('logoutBtn').onclick=logout;
    m.querySelectorAll('button.cell').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.k;
      if(isFuture(k)){toast('아직 오지 않은 날이에요');return;}
      if(readOnly){toast('저장 권한이 없어요');return;}
      if(myDays.has(k)) myDays.delete(k); else myDays.add(k);
      saveDays(); renderMe();
      if(myDays.has(k)&&k===todayKey()) toast('오늘도 기도 완료! 🙏');
    }));
  }

  // ---- 관리자 ----
  function renderAdmin(){
    const a=$('main'); if(notReady(a)) return;
    if(!unlocked || changingPw) return renderLock(a);
    const list=Object.entries(members).map(([id,m])=>({id,name:m.name||'이름 없음',pw:m.pw||'',created:m.createdAt,updated:m.updatedAt,days:new Set(Array.isArray(m.days)?m.days:[])}))
      .sort((x,y)=>y.days.size-x.days.size||x.name.localeCompare(y.name,'ko'));
    const el=elapsed(), t=todayKey();
    const todayCount=list.filter(p=>p.days.has(t)).length;
    const avg=list.length&&el?Math.round(list.reduce((s,p)=>s+p.days.size,0)/(list.length*el)*100):0;
    const perDay=DAYS.map(d=>{const k=key(d);return{k,sun:d.getDay()===0,fut:k>t,c:list.filter(p=>p.days.has(k)).length};});
    const max=Math.max(1,list.length);
    let h='<div class="me"><div class="sec-title">관리자 · 전체 현황</div><div class="row-btns">'+
      (isOwner?'<button class="btn ghost" id="pwChange">비밀번호 바꾸기</button>':'')+
      '<button class="btn ghost" id="lockBtn">잠그기</button></div></div>'+
      '<div class="stats"><div class="stat"><b>'+list.length+'</b><span>들어온 사람</span></div>'+
      '<div class="stat"><b>'+todayCount+'</b><span>오늘 기도</span></div>'+
      '<div class="stat"><b>'+avg+'%</b><span>평균 참여율</span></div></div>'+
      '<div><p class="hint" style="margin-bottom:6px">날짜별 기도한 사람 수 (10/12 → 11/15)</p><div class="daily">'+
      perDay.map(p=>'<div class="'+(p.fut?'fut':p.sun?'sun':'')+'" style="height:'+(p.fut?4:Math.max(3,p.c/max*100))+'%" title="'+p.k.slice(5).replace('-','/')+' · '+p.c+'명"></div>').join('')+
      '</div></div>';
    if(!list.length) h+='<p class="hint">아직 등록한 사람이 없어요. 기도표 링크를 나누면 등록한 사람부터 여기에 나타나요.</p>';
    else h+='<div class="ledger">'+list.map((p,i)=>{
      const open=openPerson===p.id;
      let tools='';
      if(open){
        if(confirmDel===p.id) tools='<div class="confirm"><span>'+esc(p.name)+'님의 기록을 모두 지울까요?</span><button class="btn danger" data-del="'+p.id+'">지우기</button><button class="btn ghost" data-cancel="1">취소</button></div>';
        else if(resetFor===p.id) tools='<form class="confirm" data-reset="'+p.id+'"><span>새 비밀번호</span><input type="password" id="rs-'+p.id+'" maxlength="20" inputmode="numeric" style="flex:1;min-width:100px;padding:8px 10px;font-size:15px"><button class="btn" type="submit">바꾸기</button><button class="btn ghost" type="button" data-cancel="1">취소</button></form>';
        else tools='<div class="row-btns"><button class="btn ghost" data-resetask="'+p.id+'">비밀번호 다시 정하기</button><button class="btn ghost" data-ask="'+p.id+'">기록 삭제</button></div>';
      }
      return '<div class="person"><button class="prow" data-id="'+p.id+'" aria-expanded="'+open+'">'+
        '<span class="rank'+(i<3&&p.days.size?' top':'')+'">'+(i+1)+'</span>'+
        '<span style="min-width:0"><div class="pname">'+esc(p.name)+' <span style="font-family:var(--body);font-size:14px;color:var(--harvest);background:var(--leaf-soft);border-radius:6px;padding:1px 7px;margin-left:4px">비번 '+(p.pw?esc(p.pw):'-')+'</span></div><div class="pbar"><i style="width:'+(p.days.size/TOTAL*100)+'%"></i></div></span>'+
        '<span class="pcount"><b>'+p.days.size+'일</b>'+(p.days.has(t)?'오늘 ✓':'연속 '+streak(p.days)+'일')+'</span></button>'+
        (open?'<div class="pdetail"><div class="confirm" style="background:var(--leaf-soft)"><span>비밀번호</span><b style="font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.15em">'+(p.pw?esc(p.pw):'-')+'</b>'+(p.pw?'':'<span class="hint">다음에 로그인하면 보여요</span>')+'</div><p class="hint">처음 들어온 날 '+fmtDate(p.created)+' · 마지막 기록 '+fmtDate(p.updated)+' · 체크 '+p.days.size+' / '+TOTAL+'일</p><div class="mini">'+gridHTML(p.days,false)+'</div>'+tools+'</div>':'')+
        '</div>';
    }).join('')+'</div>';
    a.innerHTML=h;
    $('lockBtn').onclick=()=>{unlocked=false;isOwner=!adminHash;openPerson=null;view=meId?'me':'login';render();};
    if($('pwChange')) $('pwChange').onclick=()=>{changingPw=true;render();};
    a.querySelectorAll('.prow').forEach(b=>b.onclick=()=>{openPerson=openPerson===b.dataset.id?null:b.dataset.id;confirmDel=null;resetFor=null;render();});
    a.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{confirmDel=b.dataset.ask;render();});
    a.querySelectorAll('[data-resetask]').forEach(b=>b.onclick=()=>{resetFor=b.dataset.resetask;render();});
    a.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{confirmDel=null;resetFor=null;render();});
    a.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      b.disabled=true;
      try{ await db.doc('members/'+b.dataset.del).delete(); confirmDel=null; openPerson=null; toast('삭제했어요'); render(); }
      catch(e){ toast('삭제하지 못했어요'); b.disabled=false; }
    });
    a.querySelectorAll('form[data-reset]').forEach(f=>f.addEventListener('submit',async e=>{
      e.preventDefault(); const id=f.dataset.reset, pw=$('rs-'+id).value;
      if(pw.length<4){toast('4자리 이상 적어 주세요');return;}
      try{ await db.doc('members/'+id).update({pin:await pinHash(id,pw),pw}); resetFor=null; toast('비밀번호를 바꿨어요'); render(); }
      catch(err){ toast('바꾸지 못했어요'); }
    }));
  }
  function renderLock(a){
    if(!adminLoaded){ a.innerHTML='<p class="hint">불러오는 중이에요…</p>'; return; }
    const pwField=(id,ph)=>'<input type="password" id="'+id+'" maxlength="40" placeholder="'+ph+'" autocomplete="off">';
    if(!adminHash || changingPw){
      if(!isOwner){ a.innerHTML='<div class="sec-title">관리자 모드</div><p class="hint">관리자 비밀번호가 아직 정해지지 않았어요.</p>'; return; }
      a.innerHTML='<div class="sec-title">'+(changingPw?'관리자 비밀번호 바꾸기':'관리자 비밀번호 만들기')+'</div>'+
        '<p class="hint">이 비밀번호를 아는 사람만 관리자 모드에 들어올 수 있어요. 4자 이상으로 정해 주세요.</p>'+
        '<form class="stack" id="pwSet">'+pwField('pwSetIn','새 관리자 비밀번호')+'<div class="row-btns"><button class="btn" type="submit">저장</button>'+(changingPw?'<button class="btn ghost" type="button" id="pwCancel">취소</button>':'')+'</div></form>';
      $('pwSet').addEventListener('submit',async e=>{
        e.preventDefault(); const v=$('pwSetIn').value; if(v.length<4){toast('4자 이상 적어 주세요');return;}
        try{ await db.doc('settings/admin').set({hash:await adminPwHash(v),updatedAt:Date.now()}); unlocked=true; changingPw=false; toast('관리자 비밀번호를 저장했어요'); render(); }
        catch(err){ toast('저장하지 못했어요'); }
      });
      if($('pwCancel')) $('pwCancel').onclick=()=>{changingPw=false;render();};
      return;
    }
    a.innerHTML='<div class="sec-title">관리자 모드</div><p class="hint">관리자 비밀번호를 입력해 주세요.</p>'+
      '<form class="stack" id="pwIn">'+pwField('pwInIn','관리자 비밀번호')+'<button class="btn" type="submit">들어가기</button></form>';
    $('pwIn').addEventListener('submit',async e=>{
      e.preventDefault(); const v=$('pwInIn').value;
      if(await adminPwHash(v)===adminHash){unlocked=true;isOwner=true;render();}
      else{toast('비밀번호가 맞지 않아요');$('pwInIn').value='';}
    });
  }

  let lastDay=todayKey();
  setInterval(()=>{ if(todayKey()!==lastDay){ lastDay=todayKey(); render(); } },60000);

  async function start(){
    db = makeDb();
    started=true;
    if(!db){ render(); return; }
    db.collection('members').onSnapshot(snap=>{
      const next={}; snap.docs.forEach(d=>{ next[d.id]=d.data()||{}; });
      members=next;
      if(!loaded){ const saved=store.get('prayer-me'); if(saved&&members[saved]){ meId=saved; view='me'; } }
      if(meId && !members[meId]){ meId=null; myDays=new Set(); store.del('prayer-me'); if(view==='me') view='login'; }
      else if(meId && inflight===0 && !snap.metadata.hasPendingWrites){ myDays=new Set(members[meId].days||[]); }
      loaded=true;
      const typing=document.activeElement&&/INPUT/.test(document.activeElement.tagName);
      if(!typing) render();
    },()=>{ if(!loaded){ db=null; render(); } else toast('기도표를 불러오지 못했어요'); });
    db.doc('settings/admin').onSnapshot(d=>{
      const nh=d.exists?(d.data()||{}).hash||null:null;
      if(adminLoaded&&nh!==adminHash&&!isOwner) unlocked=false;
      adminHash=nh; adminLoaded=true;
      // 관리자 비밀번호가 아직 없으면 처음 연 사람이 정하고, 그다음부터는 잠금을 푼 사람만 바꿀 수 있어요
      isOwner = !nh || unlocked;
      if(view==='admin'&&!changingPw) render();
    },()=>{ adminLoaded=true; });
  }
  render();
  start();
})();
</script>

</body></html>
