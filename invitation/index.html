<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<script>
/* ───────────────────────────────────────────────
 *  초대장 설정 — 여기만 고치면 됩니다
 * ─────────────────────────────────────────────── */
window.INVITE = {
  shopName: "달콤상점",
  headline: "작은 가게를 엽니다",
  date: "2026년 10월 16일 금요일",
  time: "오전 10시 — 오후 2시",
  place: "본관 1층 중앙 현관",
  placeDetail: "정문으로 들어와 오른쪽",
  message:
    "몇 주 동안 친구들과 함께 준비한 가게를 하루 동안 엽니다.\n" +
    "직접 만든 음료와 디저트를 준비했습니다.\n" +
    "바쁘시더라도 잠시 들러 주시면 큰 힘이 되겠습니다.",
  host: "3학년 2반 달콤상점 팀",
  contact: "010-0000-0000",
  color: "#0B6E4F",

  // 사전 주문 받기 (false 로 바꾸면 사전 주문 영역이 사라집니다)
  preorder: true,
  pickupTimes: ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30"],
  account: "OO은행 000-0000-0000 (예금주 홍길동)",

  // 메뉴 — code 는 키오스크(kiosk/config.js)의 code 와 똑같이 맞춰 주세요
  menu: [
    { code: "A", name: "수제 레몬에이드",   price: 2500 },
    { code: "B", name: "청포도 에이드",     price: 2500 },
    { code: "C", name: "아이스티",         price: 1500 },
    { code: "D", name: "초코칩 쿠키",       price: 1500 },
    { code: "E", name: "미니 핫도그",       price: 2000 },
    { code: "F", name: "컵과일",           price: 3000 },
    { code: "G", name: "에이드 + 쿠키 세트", price: 3500 }
  ]
};
</script>
<style>
  :root { --bg: #fbfaf7; --surface: #ffffff; --ink: #1a1a1a; --sub: #76736d; --line: #e7e4dd; --accent: #0B6E4F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; line-height: 1.7; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 24px 64px; }
  .serif { font-family: "Noto Serif KR", serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .cover { text-align: center; padding: 88px 0 64px; }
  .eyebrow { font-size: 12px; letter-spacing: .4em; color: var(--sub); }
  .cover h1 { font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 40px; line-height: 1.3; margin: 28px 0 10px; letter-spacing: -0.02em; }
  .cover .headline { font-family: "Noto Serif KR", serif; font-size: 18px; color: var(--sub); }
  .cover .rule { width: 1px; height: 56px; background: var(--line); margin: 40px auto; }
  .cover .when { font-size: 16px; }

  section { padding: 48px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 12px; letter-spacing: .3em; color: var(--sub); font-weight: 500; text-align: center; margin: 0 0 28px; }
  .message { font-family: "Noto Serif KR", serif; text-align: center; white-space: pre-line; font-size: 16px; line-height: 2; margin: 0; }
  .sign { text-align: center; color: var(--sub); font-size: 14px; margin-top: 24px; }

  dl { margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 16px; }
  dt { color: var(--sub); font-size: 14px; padding-top: 2px; }
  dd { margin: 0; font-size: 16px; }
  dd small { display: block; color: var(--sub); font-size: 14px; }
  dd a { color: inherit; }

  .menu { list-style: none; margin: 0; padding: 0; }
  .menu li { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
  .menu li:last-child { border-bottom: 0; }
  .menu .price { color: var(--sub); }
  .qty { display: flex; align-items: center; gap: 4px; margin-left: 16px; }
  .qty button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; color: var(--sub); }
  .qty span { width: 24px; text-align: center; font-weight: 600; }
  .qty.has span { color: var(--accent); }
  .row { display: flex; align-items: center; gap: 0; }

  .intro { text-align: center; color: var(--sub); font-size: 14px; margin: -12px 0 24px; }
  label { display: block; font-size: 14px; color: var(--sub); margin: 28px 0 10px; }
  .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .times button { height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 15px; }
  .times button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }
  input { width: 100%; height: 50px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; font-size: 16px; outline: none; }
  input:focus { border-color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .two label { margin-top: 28px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--ink); }
  .total b { font-size: 22px; }
  .btn { display: block; width: 100%; height: 54px; margin-top: 16px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; }
  .btn.line { background: var(--surface); color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
  .err { color: #c0392b; font-size: 14px; min-height: 20px; margin-top: 10px; text-align: center; }

  .ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; text-align: center; }
  .ticket .done { font-family: "Noto Serif KR", serif; font-size: 20px; }
  .ticket .detail { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .ticket .code { margin: 24px 0 8px; padding: 18px 12px; border: 1px dashed var(--ink); border-radius: 8px; font-size: 20px; font-weight: 700; letter-spacing: .02em; word-break: break-all; user-select: all; }
  .ticket .hint { font-size: 13px; color: var(--sub); line-height: 1.7; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--sub); font-size: 13px; padding-top: 40px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div class="eyebrow">INVITATION</div>
    <h1 id="shopName"></h1>
    <div class="headline" id="headline"></div>
    <div class="rule"></div>
    <div class="when" id="when"></div>
  </header>

  <section>
    <h2>인사말</h2>
    <p class="message" id="message"></p>
    <div class="sign" id="sign"></div>
  </section>

  <section>
    <h2>안내</h2>
    <dl>
      <dt>일시</dt><dd id="dDate"></dd>
      <dt>장소</dt><dd id="dPlace"></dd>
      <dt>문의</dt><dd id="dContact"></dd>
    </dl>
  </section>

  <section id="menuSec">
    <h2>메뉴</h2>
    <p class="intro" id="menuIntro"></p>
    <ul class="menu" id="menu"></ul>

    <div id="orderForm">
      <label>픽업 시간</label>
      <div class="times" id="times"></div>
      <div class="two">
        <div><label for="name">이름</label><input id="name" maxlength="10" placeholder="홍길동" autocomplete="name"></div>
        <div><label for="phone">휴대폰 뒷자리</label><input id="phone" inputmode="numeric" maxlength="4" placeholder="1234"></div>
      </div>
      <div class="total"><span>합계</span><b id="total">0원</b></div>
      <div class="err" id="err"></div>
      <button class="btn" id="submit">사전 주문하기</button>
    </div>

    <div class="ticket hidden" id="ticket">
      <div class="done">사전 주문이 완료되었습니다</div>
      <div class="detail" id="ticketDetail"></div>
      <div class="code" id="code"></div>
      <div class="hint">당일 부스에서 이 코드를 보여 주시거나<br>키오스크의 ‘예약 확인’에 입력해 주세요.</div>
      <div class="hint" id="account" style="margin-top:10px"></div>
      <button class="btn" id="share" style="margin-top:24px">공유하기</button>
      <button class="btn line" id="copy">코드 복사</button>
      <button class="btn line" id="again">다시 주문하기</button>
    </div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  const C = window.INVITE;
  const $ = (id) => document.getElementById(id);
  const won = (n) => n.toLocaleString("ko-KR") + "원";
  const cart = {};
  let time = "";

  document.documentElement.style.setProperty("--accent", C.color || "#1a1a1a");
  document.title = C.shopName + " 초대장";
  $("shopName").textContent = C.shopName;
  $("headline").textContent = C.headline;
  $("when").textContent = C.date;
  $("message").textContent = C.message;
  $("sign").textContent = C.host + " 드림";
  $("dDate").innerHTML = ""; $("dDate").append(C.date, Object.assign(document.createElement("small"), { textContent: C.time }));
  $("dPlace").append(C.place, Object.assign(document.createElement("small"), { textContent: C.placeDetail || "" }));
  $("dContact").append(Object.assign(document.createElement("a"), { href: "tel:" + C.contact.replace(/\D/g, ""), textContent: C.contact }));
  $("footer").textContent = C.shopName + " · " + C.host;

  const total = () => C.menu.reduce((s, m) => s + (cart[m.code] || 0) * m.price, 0);
  const summary = () => C.menu.filter((m) => cart[m.code]).map((m) => m.name + " " + cart[m.code] + "개").join(", ");

  // 메뉴 목록 (사전 주문을 받으면 수량 버튼 표시)
  C.menu.forEach((m) => {
    const li = document.createElement("li");
    const left = document.createElement("span"); left.textContent = m.name;
    const right = document.createElement("span"); right.className = "row";
    const price = document.createElement("span"); price.className = "price"; price.textContent = won(m.price);
    right.append(price);
    if (C.preorder) {
      const q = document.createElement("span"); q.className = "qty";
      q.innerHTML = '<button aria-label="빼기">−</button><span>0</span><button aria-label="더하기">+</button>';
      const [minus, plus] = q.querySelectorAll("button"), n = q.querySelector("span");
      const set = (v) => { cart[m.code] = Math.max(0, Math.min(20, v)); n.textContent = cart[m.code]; q.classList.toggle("has", cart[m.code] > 0); $("total").textContent = won(total()); };
      minus.onclick = () => set((cart[m.code] || 0) - 1);
      plus.onclick = () => set((cart[m.code] || 0) + 1);
      right.append(q);
    }
    li.append(left, right);
    $("menu").append(li);
  });

  if (!C.preorder) { $("orderForm").remove(); return; }
  $("menuIntro").textContent = "미리 주문하시면 기다리지 않고 바로 받아 가실 수 있습니다.";

  C.pickupTimes.forEach((t) => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => { time = t; $("times").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    $("times").append(b);
  });

  // 주문코드: 메뉴코드+수량-픽업시간-휴대폰뒷자리-이름  (키오스크에서 읽는 형식)
  const makeCode = (name, phone) =>
    Object.keys(cart).filter((c) => cart[c] > 0).sort().map((c) => c + cart[c]).join("") +
    "-" + time.replace(":", "") + "-" + phone + "-" + name.replace(/[\s-]+/g, "");

  let shareText = "";
  $("submit").onclick = () => {
    const name = $("name").value.trim(), phone = $("phone").value.trim();
    const err = !total() ? "메뉴를 하나 이상 선택해 주세요"
      : !time ? "픽업 시간을 선택해 주세요"
      : !name ? "이름을 입력해 주세요"
      : !/^\d{4}$/.test(phone) ? "휴대폰 번호 뒷자리 4자리를 입력해 주세요" : "";
    $("err").textContent = err;
    if (err) return;
    const code = makeCode(name, phone);
    $("ticketDetail").textContent = name + " 님 · " + time + " 픽업 · " + summary() + " · " + won(total());
    $("code").textContent = code;
    $("account").textContent = C.account ? "미리 입금하실 경우  " + C.account : "";
    shareText = "[" + C.shopName + " 사전 주문]\n" + name + " · " + time + " 픽업\n" + summary() + "\n합계 " + won(total()) + "\n주문코드: " + code;
    $("orderForm").classList.add("hidden");
    $("ticket").classList.remove("hidden");
    $("ticket").scrollIntoView({ behavior: "smooth", block: "center" });
  };

  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(shareText); $("copy").textContent = "복사되었습니다"; }
    catch (e) { $("copy").textContent = "코드를 길게 눌러 복사해 주세요"; }
  };
  $("share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title: C.shopName + " 사전 주문", text: shareText }); } catch (e) {} }
    else $("copy").onclick();
  };
  $("again").onclick = () => {
    $("ticket").classList.add("hidden");
    $("orderForm").classList.remove("hidden");
    $("copy").textContent = "코드 복사";
  };
})();
</script>
</body>
</html>
