<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>키오스크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf0; --card: #ffffff; --ink: #3b3024; --muted: #8a7a66; --line: #f0e3c8;
    --accent: #f5b700; --soft: #fff1c2; --pre: #6c8cff; --pre-soft: #e8edff;
    --ok: #2f9e6a; --ok-soft: #dff5ea; --bad: #d9534f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Gowun Dodum", system-ui, sans-serif; user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .jua { font-family: "Jua", sans-serif; font-weight: 400; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  .muted { color: var(--muted); }

  /* ── 홈 ── */
  #home { align-items: center; justify-content: center; text-align: center; padding: 24px 16px; gap: 10px; }
  #home .logo { font-size: 96px; line-height: 1; }
  #home h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(40px, 7vw, 64px); margin: 8px 0 0; }
  .home-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: min(900px, 100%); margin-top: 28px; }
  .home-btn { border: 0; border-radius: 28px; padding: 28px 12px; background: var(--accent); box-shadow: 0 8px 0 rgba(0,0,0,.08); }
  .home-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .home-btn .i { font-size: 52px; display: block; }
  .home-btn .t { font-family: "Jua", sans-serif; font-size: clamp(22px, 3vw, 30px); display: block; margin-top: 6px; }
  .home-btn .s { font-size: 14px; opacity: .75; }
  .home-btn.pre { background: var(--pre); color: #fff; }
  .home-btn.find { background: var(--card); border: 2px solid var(--line); }
  .ready-board { margin-top: 28px; min-height: 60px; }
  .ready-board .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  .chip { background: var(--ok-soft); color: var(--ok); border-radius: 999px; padding: 6px 16px; font-family: "Jua", sans-serif; font-size: 24px; }
  .gear { position: fixed; top: 12px; right: 12px; border: 0; background: transparent; font-size: 26px; opacity: .35; padding: 8px; }

  /* ── 주문 ── */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  .topbar h2 { margin: 0; font-family: "Jua", sans-serif; font-weight: 400; font-size: 26px; flex: 1; }
  .back { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 16px; }
  .badge { border-radius: 999px; padding: 4px 12px; font-size: 14px; background: var(--soft); }
  .badge.pre { background: var(--pre-soft); color: var(--pre); }

  .order-body { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  .menu-side { overflow-y: auto; padding: 12px 16px 24px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; position: sticky; top: -12px; background: var(--bg); padding: 12px 0 8px; z-index: 1; }
  .tab { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 17px; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .item { border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 16px 12px; text-align: center; position: relative; }
  .item:active { transform: scale(.97); }
  .item .em { font-size: 54px; }
  .item .n { font-family: "Jua", sans-serif; font-size: 20px; margin-top: 4px; }
  .item .d { font-size: 13px; color: var(--muted); min-height: 36px; line-height: 1.4; }
  .item .p { font-family: "Jua", sans-serif; font-size: 20px; margin-top: 6px; }
  .item .q { position: absolute; top: 8px; right: 8px; background: var(--accent); border-radius: 999px; min-width: 30px; height: 30px; line-height: 30px; font-family: "Jua", sans-serif; }

  .cart-side { border-left: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  .cart-side h3 { margin: 0; padding: 16px; font-family: "Jua", sans-serif; font-weight: 400; font-size: 22px; border-bottom: 1px solid var(--line); }
  .cart-list { flex: 1; overflow-y: auto; padding: 4px 16px; }
  .cart-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .cart-row .n { flex: 1; }
  .cart-row .n small { display: block; color: var(--muted); }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); font-size: 20px; }
  .step span { min-width: 22px; text-align: center; font-family: "Jua", sans-serif; font-size: 18px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .cart-foot { padding: 16px; border-top: 2px solid var(--line); }
  .sum { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; }
  .sum b { font-family: "Jua", sans-serif; font-weight: 400; font-size: 30px; }
  .big-btn { width: 100%; margin-top: 12px; border: 0; border-radius: 16px; padding: 18px; background: var(--accent); font-family: "Jua", sans-serif; font-size: 24px; }
  .big-btn.pre { background: var(--pre); color: #fff; }
  .big-btn:disabled { opacity: .35; }
  .big-btn.ghost { background: var(--soft); color: var(--ink); }

  /* ── 모달 ── */
  .modal { position: fixed; inset: 0; background: rgba(40,30,10,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.on { display: flex; }
  .sheet { background: var(--card); border-radius: 24px; padding: 24px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; }
  .sheet h3 { margin: 0 0 4px; font-family: "Jua", sans-serif; font-weight: 400; font-size: 28px; }
  .sheet label { display: block; margin: 16px 0 6px; color: var(--muted); font-size: 15px; }
  .sheet input { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fffdf7; user-select: text; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .opt { border: 1px solid var(--line); background: #fffdf7; border-radius: 12px; padding: 12px 6px; font-size: 18px; }
  .opt.on { background: var(--accent); border-color: var(--accent); font-weight: bold; }
  .opt:disabled { opacity: .3; }
  .row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .err { color: var(--bad); min-height: 22px; margin-top: 10px; }

  /* ── 완료 ── */
  #done { align-items: center; justify-content: center; text-align: center; padding: 24px 16px; }
  #done .label { font-size: 22px; color: var(--muted); }
  #done .no { font-family: "Jua", sans-serif; font-size: clamp(110px, 22vw, 180px); line-height: 1; color: var(--accent); }
  #done.pre .no { color: var(--pre); }
  #done .detail { font-size: 20px; margin: 10px 0 4px; }
  #done .count { margin-top: 18px; }

  /* ── 사전주문 찾기 ── */
  .find-body { flex: 1; overflow-y: auto; padding: 20px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; max-width: 1000px; margin: 0 auto; width: 100%; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .panel h3 { margin: 0 0 6px; font-family: "Jua", sans-serif; font-weight: 400; font-size: 24px; }
  .pin-show { font-family: "Jua", sans-serif; font-size: 44px; letter-spacing: .3em; text-align: center; min-height: 60px; border-bottom: 2px solid var(--line); margin: 10px 0 14px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .keypad button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 0; font-family: "Jua", sans-serif; font-size: 28px; }
  .panel input { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #fffdf7; user-select: text; }
  .results { grid-column: 1 / -1; }
  .res { border: 2px solid var(--pre); background: var(--pre-soft); border-radius: 18px; padding: 16px; margin-top: 12px; display: flex; gap: 16px; align-items: center; }
  .res .no { font-family: "Jua", sans-serif; font-size: 48px; color: var(--pre); min-width: 90px; text-align: center; }

  /* ── 관리자 ── */
  #admin .topbar { flex-wrap: wrap; }
  .atabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .admin-body { flex: 1; overflow-y: auto; padding: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .ocard { background: var(--card); border: 1px solid var(--line); border-left: 8px solid var(--accent); border-radius: 16px; padding: 14px; }
  .ocard.pre { border-left-color: var(--pre); }
  .ocard.s-준비완료 { background: var(--ok-soft); }
  .ocard.s-완료, .ocard.s-취소 { opacity: .55; }
  .ocard .head { display: flex; justify-content: space-between; align-items: baseline; }
  .ocard .no { font-family: "Jua", sans-serif; font-size: 34px; }
  .ocard ul { margin: 8px 0; padding-left: 18px; font-size: 17px; }
  .ocard .meta { font-size: 14px; color: var(--muted); }
  .ocard .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .ocard .acts button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .ocard .acts .main { background: var(--ink); color: #fff; border-color: var(--ink); }
  .paid { font-size: 13px; border-radius: 999px; padding: 2px 10px; background: #fde2e1; color: var(--bad); }
  .paid.y { background: var(--ok-soft); color: var(--ok); }
  .group-title { font-family: "Jua", sans-serif; font-size: 22px; margin: 18px 0 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .stat b { display: block; font-family: "Jua", sans-serif; font-weight: 400; font-size: 32px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 16px; overflow: hidden; margin-top: 12px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  td.r, th.r { text-align: right; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .tools button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 16px; }
  .tools .danger { color: var(--bad); }
  .import { display: flex; gap: 8px; margin-bottom: 14px; }
  .import input { flex: 1; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); user-select: text; }
  .import button { border: 0; background: var(--pre); color: #fff; border-radius: 12px; padding: 0 16px; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }

  @media (max-width: 760px) {
    body { overflow: auto; }
    .home-btns { grid-template-columns: 1fr; }
    .home-btn { padding: 20px 12px; }
    .order-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .cart-side { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .find-body { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- 홈 -->
<section class="screen on" id="home">
  <button class="gear" data-go="pin" aria-label="관리자">⚙️</button>
  <div class="logo" id="homeLogo"></div>
  <h1 id="homeName"></h1>
  <div class="muted" id="homeSlogan"></div>
  <div class="home-btns">
    <button class="home-btn" data-start="now"><span class="i">🛍️</span><span class="t">지금 주문하기</span><span class="s">바로 만들어 드려요</span></button>
    <button class="home-btn pre" data-start="pre"><span class="i">📅</span><span class="t">사전 주문 (예약)</span><span class="s">원하는 시간에 픽업</span></button>
    <button class="home-btn find" data-go="find"><span class="i">🎟️</span><span class="t">사전 주문 찾기</span><span class="s">예약 확인 · 초대장 코드</span></button>
  </div>
  <div class="ready-board" id="readyBoard"></div>
</section>

<!-- 메뉴 고르기 -->
<section class="screen" id="order">
  <div class="topbar">
    <button class="back" data-go="home">← 처음으로</button>
    <h2>메뉴를 골라 주세요</h2>
    <span class="badge" id="modeBadge"></span>
  </div>
  <div class="order-body">
    <div class="menu-side">
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="cart-side">
      <h3>🧺 장바구니</h3>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-foot">
        <div class="sum"><span>합계</span><b id="cartSum">0원</b></div>
        <button class="big-btn" id="checkoutBtn" disabled>주문하기</button>
      </div>
    </aside>
  </div>
</section>

<!-- 주문 정보 입력 -->
<div class="modal" id="checkout">
  <div class="sheet">
    <h3 id="coTitle">주문 확인</h3>
    <div class="muted" id="coSummary"></div>

    <div id="preFields">
      <label>픽업 시간</label>
      <div class="opts" id="coTimes"></div>
      <div class="row2">
        <div><label for="coPhone">전화번호 뒷자리</label><input id="coPhone" inputmode="numeric" maxlength="4" placeholder="1234"></div>
        <div><label for="coName">이름</label><input id="coName" maxlength="10" placeholder="김민수"></div>
      </div>
    </div>
    <div id="nowFields">
      <label for="coNameNow">이름 (선택 · 부르기 쉽게)</label>
      <input id="coNameNow" maxlength="10" placeholder="비워도 괜찮아요">
    </div>

    <label>결제 방법</label>
    <div class="opts" id="coPays"></div>
    <div class="muted" id="coAccount" style="margin-top:8px"></div>

    <div class="err" id="coErr"></div>
    <button class="big-btn" id="coSubmit">주문 완료</button>
    <button class="big-btn ghost" id="coCancel">돌아가기</button>
  </div>
</div>

<!-- 주문 완료 -->
<section class="screen" id="done">
  <div class="label" id="doneLabel">주문번호</div>
  <div class="no" id="doneNo"></div>
  <div class="detail" id="doneDetail"></div>
  <div class="muted" id="doneGuide"></div>
  <div class="muted count" id="doneCount"></div>
  <button class="big-btn" style="width:min(360px,100%)" data-go="home">처음으로</button>
</section>

<!-- 사전주문 찾기 -->
<section class="screen" id="find">
  <div class="topbar">
    <button class="back" data-go="home">← 처음으로</button>
    <h2>사전 주문 찾기</h2>
  </div>
  <div class="find-body">
    <div class="panel">
      <h3>📱 전화번호 뒷자리로 찾기</h3>
      <div class="pin-show" id="findShow"></div>
      <div class="keypad" id="findPad"></div>
    </div>
    <div class="panel">
      <h3>💌 초대장에서 받은 코드</h3>
      <p class="muted">초대장에서 사전 주문하셨다면, 받은 주문코드를 입력해 주세요.</p>
      <input id="codeInput" placeholder="예) A2D1-1030-1234-김민수">
      <div class="err" id="codeErr"></div>
      <button class="big-btn pre" id="codeBtn">코드 등록하기</button>
    </div>
    <div class="results" id="findResults"></div>
  </div>
</section>

<!-- 관리자 PIN -->
<section class="screen" id="pin">
  <div class="topbar">
    <button class="back" data-go="home">← 처음으로</button>
    <h2>관리자 확인</h2>
  </div>
  <div class="find-body" style="grid-template-columns:minmax(0,380px);justify-content:center">
    <div class="panel">
      <h3>🔒 비밀번호</h3>
      <div class="pin-show" id="pinShow"></div>
      <div class="keypad" id="pinPad"></div>
      <div class="err" id="pinErr"></div>
    </div>
  </div>
</section>

<!-- 관리자 -->
<section class="screen" id="admin">
  <div class="topbar">
    <button class="back" data-go="home">← 손님 화면</button>
    <h2>관리자</h2>
    <div class="atabs" id="atabs">
      <button class="tab on" data-tab="live">주문 현황</button>
      <button class="tab" data-tab="pre">사전 주문</button>
      <button class="tab" data-tab="all">전체 내역</button>
      <button class="tab" data-tab="sales">매출</button>
    </div>
  </div>
  <div class="admin-body" id="adminBody"></div>
</section>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const S = window.SHOP, U = window.ShopUtil;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ── 저장소 (이 기기의 브라우저에 저장) ── */
  const KEY = "miniShop.v1";
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || { orders: [], seqNow: 0, seqPre: 0 }; }
    catch (e) { return { orders: [], seqNow: 0, seqPre: 0 }; }
  }
  let db = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { toast("저장에 실패했어요. 브라우저 저장공간을 확인해 주세요."); }
  }
  // 같은 기기의 다른 탭(예: 관리자 창)에서 바뀌면 다시 그리기
  window.addEventListener("storage", (e) => { if (e.key === KEY) { db = load(); rerender(); } });

  function addOrder(o) {
    const pre = o.type === "pre";
    const n = pre ? ++db.seqPre : ++db.seqNow;
    const order = Object.assign({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      no: pre ? "P" + n : String(n),
      total: U.cartTotal(o.items),
      status: "접수",
      paid: false,
      createdAt: new Date().toISOString()
    }, o);
    db.orders.push(order);
    save();
    return order;
  }

  /* ── 화면 이동 ── */
  let current = "home", idleTimer = null, doneTimer = null;
  function go(name) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === name));
    current = name;
    $("checkout").classList.remove("on");
    clearInterval(doneTimer);
    if (name === "home") renderHome();
    if (name === "find") { findDigits = ""; renderFind(); }
    if (name === "pin") { pinDigits = ""; $("pinShow").textContent = ""; $("pinErr").textContent = ""; }
    if (name === "admin") renderAdmin();
    bumpIdle();
  }
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-go]");
    if (g) go(g.dataset.go);
    const s = e.target.closest("[data-start]");
    if (s) startOrder(s.dataset.start);
  });

  // 손님 화면에서 90초 동안 아무것도 안 하면 처음으로
  function bumpIdle() {
    clearTimeout(idleTimer);
    if (["order", "find"].includes(current)) idleTimer = setTimeout(() => go("home"), 90000);
  }
  ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, bumpIdle));

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200);
  }

  /* ── 홈 ── */
  document.title = S.name + " 키오스크";
  $("homeLogo").textContent = S.emoji;
  $("homeName").textContent = S.name;
  $("homeSlogan").textContent = S.slogan;
  function renderHome() {
    const ready = db.orders.filter((o) => o.status === "준비완료");
    $("readyBoard").innerHTML = ready.length
      ? '<div class="muted">🔔 준비 완료! 가져가세요</div><div class="chips">' +
        ready.map((o) => '<span class="chip">' + esc(o.no) + "</span>").join("") + "</div>"
      : "";
  }

  /* ── 메뉴 / 장바구니 ── */
  let mode = "now", cart = {}, cat = "전체";
  const cats = ["전체", ...new Set(S.menu.map((m) => m.category))];

  function startOrder(m) {
    mode = m; cart = {}; cat = "전체";
    $("modeBadge").textContent = m === "pre" ? "📅 사전 주문" : "🛍️ 지금 주문";
    $("modeBadge").className = "badge" + (m === "pre" ? " pre" : "");
    $("checkoutBtn").className = "big-btn" + (m === "pre" ? " pre" : "");
    renderMenu(); renderCart();
    go("order");
  }

  function renderMenu() {
    $("tabs").innerHTML = cats.map((c) => '<button class="tab' + (c === cat ? " on" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + "</button>").join("");
    $("grid").innerHTML = S.menu
      .filter((m) => cat === "전체" || m.category === cat)
      .map((m) =>
        '<button class="item" data-add="' + m.code + '">' +
        (cart[m.code] ? '<span class="q">' + cart[m.code] + "</span>" : "") +
        '<div class="em">' + esc(m.emoji) + '</div><div class="n">' + esc(m.name) + '</div>' +
        '<div class="d">' + esc(m.desc) + '</div><div class="p">' + U.won(m.price) + "</div></button>")
      .join("");
  }
  $("tabs").addEventListener("click", (e) => { const t = e.target.closest("[data-cat]"); if (t) { cat = t.dataset.cat; renderMenu(); } });
  $("grid").addEventListener("click", (e) => { const t = e.target.closest("[data-add]"); if (t) setQty(t.dataset.add, (cart[t.dataset.add] || 0) + 1); });
  $("cartList").addEventListener("click", (e) => {
    const t = e.target.closest("[data-d]");
    if (t) setQty(t.dataset.c, (cart[t.dataset.c] || 0) + Number(t.dataset.d));
  });

  function setQty(code, q) {
    q = Math.max(0, Math.min(30, q));
    if (q) cart[code] = q; else delete cart[code];
    renderMenu(); renderCart();
  }

  function renderCart() {
    const codes = Object.keys(cart);
    $("cartList").innerHTML = codes.length
      ? codes.map((c) => {
          const m = U.byCode(c);
          return '<div class="cart-row"><div class="n">' + esc(m.emoji + " " + m.name) + "<small>" + U.won(m.price * cart[c]) + "</small></div>" +
            '<div class="step"><button data-c="' + c + '" data-d="-1">−</button><span>' + cart[c] + '</span><button data-c="' + c + '" data-d="1">+</button></div></div>';
        }).join("")
      : '<div class="empty">메뉴를 눌러 담아 주세요</div>';
    $("cartSum").textContent = U.won(U.cartTotal(cart));
    $("checkoutBtn").disabled = !codes.length;
  }

  /* ── 주문 정보 입력 ── */
  let coTime = "", coPay = "";
  $("checkoutBtn").onclick = () => {
    const pre = mode === "pre";
    coTime = ""; coPay = "";
    $("coTitle").textContent = pre ? "사전 주문 정보" : "주문 확인";
    $("coSummary").textContent = U.cartText(cart) + " · 합계 " + U.won(U.cartTotal(cart));
    $("preFields").style.display = pre ? "" : "none";
    $("nowFields").style.display = pre ? "none" : "";
    ["coPhone", "coName", "coNameNow"].forEach((id) => ($(id).value = ""));
    $("coErr").textContent = "";
    $("coSubmit").className = "big-btn" + (pre ? " pre" : "");
    $("coAccount").textContent = "";

    $("coTimes").innerHTML = S.pickupTimes.map((t) => '<button class="opt" data-t="' + t + '">' + t + "</button>").join("");
    $("coPays").innerHTML = S.payments.map((p) => '<button class="opt" data-p="' + esc(p) + '">' + esc(p) + "</button>").join("");
    $("checkout").classList.add("on");
  };
  $("coTimes").addEventListener("click", (e) => {
    const b = e.target.closest("[data-t]"); if (!b || b.disabled) return;
    coTime = b.dataset.t;
    $("coTimes").querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === b));
  });
  $("coPays").addEventListener("click", (e) => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    coPay = b.dataset.p;
    $("coPays").querySelectorAll(".opt").forEach((x) => x.classList.toggle("on", x === b));
    $("coAccount").textContent = coPay === "계좌이체" && S.account ? "입금 계좌: " + S.account : "";
  });
  $("coCancel").onclick = () => $("checkout").classList.remove("on");

  $("coSubmit").onclick = () => {
    const pre = mode === "pre";
    const name = (pre ? $("coName") : $("coNameNow")).value.trim();
    const phone = $("coPhone").value.trim();
    const err = pre && !coTime ? "픽업 시간을 골라 주세요."
      : pre && !/^\d{4}$/.test(phone) ? "전화번호 뒷자리 4자리를 입력해 주세요."
      : pre && !name ? "이름을 입력해 주세요."
      : !coPay ? "결제 방법을 골라 주세요." : "";
    $("coErr").textContent = err;
    if (err) return;
    const o = addOrder({ type: mode, items: Object.assign({}, cart), name, phone: pre ? phone : "", time: pre ? coTime : "", payment: coPay, source: "키오스크" });
    showDone(o);
  };

  function showDone(o) {
    const pre = o.type === "pre";
    $("done").classList.toggle("pre", pre);
    $("doneLabel").textContent = pre ? "예약번호" : "주문번호";
    $("doneNo").textContent = o.no;
    $("doneDetail").textContent = U.cartText(o.items) + " · " + U.won(o.total);
    $("doneGuide").textContent = pre
      ? (o.name + "님, " + o.time + "에 부스로 오셔서 예약번호나 전화번호 뒷자리(" + o.phone + ")를 말씀해 주세요.")
      : (o.payment + " 결제는 카운터에서 도와드릴게요. 번호가 불리면 가져가 주세요!");
    go("done");
    let left = 12;
    $("doneCount").textContent = left + "초 후 처음 화면으로 돌아가요";
    doneTimer = setInterval(() => {
      left -= 1;
      $("doneCount").textContent = left + "초 후 처음 화면으로 돌아가요";
      if (left <= 0) go("home");
    }, 1000);
  }

  /* ── 키패드 ── */
  function keypad(el, onKey) {
    el.innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "지움", "0", "←"].map((k) => '<button data-k="' + k + '">' + k + "</button>").join("");
    el.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) onKey(b.dataset.k); });
  }
  const applyKey = (s, k) => (k === "지움" ? "" : k === "←" ? s.slice(0, -1) : s.length < 4 ? s + k : s);

  /* ── 사전주문 찾기 ── */
  let findDigits = "";
  keypad($("findPad"), (k) => { findDigits = applyKey(findDigits, k); renderFind(); });
  function renderFind(list) {
    $("findShow").textContent = findDigits.padEnd(4, "·");
    $("codeErr").textContent = "";
    if (!list && findDigits.length === 4)
      list = db.orders.filter((o) => o.type === "pre" && o.phone === findDigits && !["완료", "취소"].includes(o.status));
    if (!list) { $("findResults").innerHTML = ""; return; }
    $("findResults").innerHTML = list.length
      ? list.map((o) =>
          '<div class="res"><div class="no">' + esc(o.no) + '</div><div><div class="jua" style="font-size:22px">' + esc(o.name) + "님 · " + esc(o.time) + " 픽업</div>" +
          "<div>" + esc(U.cartText(o.items)) + " · " + U.won(o.total) + '</div><div class="muted">상태: ' + esc(o.status) + " · " + (o.paid ? "결제 완료" : "결제 전") +
          " — 이 화면을 직원에게 보여 주세요</div></div></div>").join("")
      : '<div class="panel muted">해당 번호로 된 사전 주문이 없어요. 초대장에서 주문하셨다면 오른쪽에 코드를 입력해 주세요.</div>';
  }

  function importCode(text) {
    const p = U.decodePreorder(text);
    if (!p) return { error: "코드 형식이 맞지 않아요. 예) A2D1-1030-1234-김민수" };
    const dup = db.orders.find((o) => o.code && o.code.toUpperCase() === p.code.toUpperCase());
    if (dup) return { order: dup, dup: true };
    return { order: addOrder({ type: "pre", items: p.cart, name: p.name, phone: p.phone, time: p.time, payment: "현장결제", source: "초대장", code: p.code }) };
  }
  $("codeBtn").onclick = () => {
    const r = importCode($("codeInput").value.trim());
    if (r.error) { $("codeErr").textContent = r.error; return; }
    $("codeInput").value = "";
    toast(r.dup ? "이미 등록된 사전 주문이에요" : "사전 주문이 등록됐어요!");
    renderFind([r.order]);
  };

  /* ── 관리자 PIN ── */
  let pinDigits = "";
  keypad($("pinPad"), (k) => {
    pinDigits = applyKey(pinDigits, k);
    $("pinShow").textContent = "●".repeat(pinDigits.length);
    if (pinDigits.length === 4) {
      if (pinDigits === String(S.adminPin)) go("admin");
      else { $("pinErr").textContent = "비밀번호가 달라요"; pinDigits = ""; $("pinShow").textContent = ""; }
    }
  });

  /* ── 관리자 화면 ── */
  let atab = "live";
  $("atabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    atab = b.dataset.tab;
    $("atabs").querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
    renderAdmin();
  });

  const NEXT = { "접수": "준비완료", "준비완료": "완료" };
  const NEXT_LABEL = { "접수": "준비 완료 ✓", "준비완료": "전달 완료 ✓" };

  function card(o) {
    const pre = o.type === "pre";
    return '<div class="ocard ' + (pre ? "pre " : "") + "s-" + o.status + '">' +
      '<div class="head"><span class="no">' + esc(o.no) + '</span><span class="paid' + (o.paid ? " y" : "") + '">' + (o.paid ? "결제완료" : "미결제") + "</span></div>" +
      '<div class="meta">' + (pre ? "📅 " + esc(o.time) + " 픽업 · " + esc(o.name) + " (" + esc(o.phone) + ")" : "🛍️ 지금 주문" + (o.name ? " · " + esc(o.name) : "")) + "</div>" +
      "<ul>" + Object.entries(o.items).map(([c, q]) => "<li>" + esc(U.byCode(c) ? U.byCode(c).name : c) + " × " + q + "</li>").join("") + "</ul>" +
      '<div class="meta">' + U.won(o.total) + " · " + esc(o.payment) + " · " + esc(o.source || "") + " · " + new Date(o.createdAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) + " · <b>" + esc(o.status) + "</b></div>" +
      '<div class="acts">' +
      (NEXT[o.status] ? '<button class="main" data-act="next" data-id="' + o.id + '">' + NEXT_LABEL[o.status] + "</button>" : "") +
      '<button data-act="paid" data-id="' + o.id + '">' + (o.paid ? "결제 취소" : "결제 확인") + "</button>" +
      (o.status === "완료" || o.status === "취소" ? '<button data-act="reopen" data-id="' + o.id + '">되돌리기</button>' : '<button data-act="cancel" data-id="' + o.id + '">주문 취소</button>') +
      "</div></div>";
  }

  function renderAdmin() {
    const body = $("adminBody");
    const active = (o) => !["완료", "취소"].includes(o.status);
    if (atab === "live") {
      const list = db.orders.filter((o) => active(o) && (o.type === "now" || o.status === "준비완료"));
      body.innerHTML = list.length ? '<div class="cards">' + list.map(card).join("") + "</div>"
        : '<p class="muted">지금 들어온 주문이 없어요. 사전 주문은 [사전 주문] 탭에서 볼 수 있어요.</p>';
    } else if (atab === "pre") {
      const list = db.orders.filter((o) => o.type === "pre" && active(o)).sort((a, b) => a.time.localeCompare(b.time));
      const times = [...new Set(list.map((o) => o.time))];
      body.innerHTML =
        '<div class="import"><input id="adminCode" placeholder="초대장 주문코드 붙여넣기 (여러 개도 한 번에 가능)"><button id="adminImport">등록</button></div>' +
        (times.length ? times.map((t) => {
          const group = list.filter((o) => o.time === t);
          const need = {};
          group.forEach((o) => Object.entries(o.items).forEach(([c, q]) => (need[c] = (need[c] || 0) + q)));
          return '<div class="group-title">⏰ ' + esc(t) + ' <span class="muted" style="font-size:16px">— 준비할 것: ' + esc(U.cartText(need)) + '</span></div><div class="cards">' + group.map(card).join("") + "</div>";
        }).join("") : '<p class="muted">남은 사전 주문이 없어요.</p>');
      $("adminImport").onclick = () => {
        const text = $("adminCode").value;
        const parts = text.match(/(?:[A-Za-z]\d{1,2})+-\d{4}-\d{4}-[^\s-]+/g) || [];
        if (!parts.length) { toast("코드를 찾지 못했어요"); return; }
        let added = 0;
        parts.forEach((p) => { const r = importCode(p); if (r.order && !r.dup) added++; });
        toast(added + "건 등록 (중복 " + (parts.length - added) + "건 제외)");
        renderAdmin();
      };
    } else if (atab === "all") {
      const list = db.orders.slice().reverse();
      body.innerHTML = list.length ? '<div class="cards">' + list.map(card).join("") + "</div>" : '<p class="muted">아직 주문이 없어요.</p>';
    } else {
      const valid = db.orders.filter((o) => o.status !== "취소");
      const paid = valid.filter((o) => o.paid);
      const sum = (l) => l.reduce((s, o) => s + o.total, 0);
      const perItem = {};
      valid.forEach((o) => Object.entries(o.items).forEach(([c, q]) => (perItem[c] = (perItem[c] || 0) + q)));
      const byPay = {};
      paid.forEach((o) => (byPay[o.payment] = (byPay[o.payment] || 0) + o.total));
      body.innerHTML =
        '<div class="stats">' +
        '<div class="stat"><span class="muted">총 주문 금액</span><b>' + U.won(sum(valid)) + "</b></div>" +
        '<div class="stat"><span class="muted">실제 결제된 금액</span><b>' + U.won(sum(paid)) + "</b></div>" +
        '<div class="stat"><span class="muted">아직 안 받은 돈</span><b>' + U.won(sum(valid) - sum(paid)) + "</b></div>" +
        '<div class="stat"><span class="muted">주문 수 (지금 / 사전)</span><b>' + valid.filter((o) => o.type === "now").length + " / " + valid.filter((o) => o.type === "pre").length + "</b></div>" +
        "</div>" +
        '<table><tr><th>메뉴</th><th class="r">판매 수량</th><th class="r">금액</th></tr>' +
        S.menu.map((m) => "<tr><td>" + esc(m.emoji + " " + m.name) + '</td><td class="r">' + (perItem[m.code] || 0) + '</td><td class="r">' + U.won((perItem[m.code] || 0) * m.price) + "</td></tr>").join("") +
        "</table>" +
        '<table><tr><th>결제 방법</th><th class="r">받은 금액</th></tr>' +
        (Object.keys(byPay).length ? Object.entries(byPay).map(([p, v]) => "<tr><td>" + esc(p) + '</td><td class="r">' + U.won(v) + "</td></tr>").join("") : '<tr><td colspan="2" class="muted">아직 결제 확인된 주문이 없어요</td></tr>') +
        "</table>" +
        '<div class="tools"><button id="csvBtn">📄 엑셀(CSV)로 내보내기</button><button class="danger" id="resetBtn">🗑️ 모든 주문 지우기</button></div>';
      $("csvBtn").onclick = exportCsv;
      $("resetBtn").onclick = () => {
        if (!confirm("정말 모든 주문을 지울까요? 되돌릴 수 없어요.\n(지우기 전에 CSV로 내보내 두는 걸 추천해요)")) return;
        db = { orders: [], seqNow: 0, seqPre: 0 }; save(); renderAdmin(); toast("모두 지웠어요");
      };
    }
  }

  $("adminBody").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const o = db.orders.find((x) => x.id === b.dataset.id); if (!o) return;
    if (b.dataset.act === "next") o.status = NEXT[o.status];
    if (b.dataset.act === "paid") o.paid = !o.paid;
    if (b.dataset.act === "cancel") { if (!confirm(o.no + "번 주문을 취소할까요?")) return; o.status = "취소"; }
    if (b.dataset.act === "reopen") o.status = "접수";
    save(); renderAdmin();
  });

  function exportCsv() {
    const rows = [["번호", "종류", "상태", "결제", "결제방법", "이름", "전화뒷자리", "픽업시간", "메뉴", "금액", "경로", "주문시각"]];
    db.orders.forEach((o) => rows.push([o.no, o.type === "pre" ? "사전" : "지금", o.status, o.paid ? "완료" : "미결제", o.payment, o.name, o.phone, o.time, U.cartText(o.items), o.total, o.source || "", new Date(o.createdAt).toLocaleString("ko-KR")]));
    const csv = "﻿" + rows.map((r) => r.map((v) => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = S.name + "_주문내역.csv";
    a.click();
  }

  function rerender() {
    if (current === "home") renderHome();
    if (current === "admin") renderAdmin();
  }

  renderHome();
})();
</script>
</body>
</html>
